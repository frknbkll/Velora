name: Velora checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: velora-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15.2'
      - name: Install image-tool test dependency
        run: python -m pip install --requirement requirements-tools.txt
      - name: Test application and maintenance tools with disposable data
        run: python -m unittest discover -s py/tests -p 'test_*.py'
      - name: Check audit scanner
        run: python py/tools/security-audit.py --self-test
